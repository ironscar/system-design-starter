<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Shard Rebalancing Calculator</title>
        <script>
            var m = 0;
            var p = 0;
            var n1 = 0;
            var n2 = 0;
            var v = 0;            

            function initialize() {
                m = parseInt(document.getElementById('totalRecords').value);
                p = parseInt(document.getElementById('precision').value);
                n1 = parseInt(document.getElementById('oldShards').value);
                n2 = parseInt(document.getElementById('newShards').value);
                v = parseInt(document.getElementById('virtualShards').value);
            }

            function rebalanceModShard() {
                let migrationsReq = 0;
                var oldShardsList = [];
                var newShardsList = [];
                initialize();
                
                // initialize shard lists
                for (var i = 0 ; i < n1 ; i++) {
                    oldShardsList.push([]);
                }
                for (var i = 0 ; i < n2 ; i++) {
                    newShardsList.push([]);
                }

                // set data within shards as per modulo
                for (var i = 0 ; i < m ; i++) {
                    oldShardsList[i%n1].push(i);
                    newShardsList[i%n2].push(i);
                    if (i%n1 != i%n2) {
                        migrationsReq++;
                    }
                }

                // display data
                console.log('For modulo shard:');
                console.log('number of migrations required = ' + migrationsReq);
                console.log('migrations as percentage of total data = ' + (migrationsReq * 100)/m + '%');
            }

            /**
             * 32-bit murmur hash gives the position on a hash ring of 2^32 items (0 to 4,294,967,295)
             * reduces hash by "precision" digits
             */
            function murmurHash(key, precision) {
                // specifically chosen prime numbers
                let c1 = 0xcc9e2d51;
                let c2 = 0x1b873593;

                // other random constants
                let d1 = 0x85ebca6b;
                let d2 = 0xc2b2ae35;

                // rotation constants
                let r1 = 15;
                let r2 = 13;
                let r3 = 16;
                
                // multiplier constant
                let m = 5;
                let n = 0xe6546b64;

                // initial seed value in hash
                let hash = 0x00000001;

                // use encoder to get bytes of string and process them in chunks of 4 bytes
                let encoder = new TextEncoder();
                const bytes = encoder.encode(key);
                const view = new DataView(bytes.buffer);
                let offset = 0;
                while (bytes.length - offset >= 4) {
                    let k = view.getUint32(offset, true);
                    offset += 4;
                    k = Math.imul(k,c1);
                    k = (k << r1) | (k >>> (32 - r1));
                    k = Math.imul(k,c2);
                    hash ^= k;
                    hash = (hash << r2) | (hash >>> (32 - r2));
                    hash = (hash*m) + n;
                }

                // take remaining bytes and safely construct u32 int because getUint32 will fail if less than 4 bytes
                let k1 = 0;
                switch (bytes.length - offset) {
                    case 3: k1 ^= bytes[offset + 2] << 16;
                    case 2: k1 ^= bytes[offset + 1] << 8;
                    case 1: k1 ^= bytes[offset];
                }
                k1 = Math.imul(k1,c1);
                k1 = (k1 << r1) | (k1 >>> (32 - r1));
                k1 = Math.imul(k1,c2);
                hash ^= k1;

                // final hash updates
                hash ^= bytes.length;
                hash ^= hash >> r3;
                hash = Math.imul(hash,d1);
                hash ^= hash >> r2;
                hash = Math.imul(hash,d2);
                hash ^= hash >> r3;

                return Math.floor(hash/Math.pow(10, precision));
            }
            
            function rebalanceRingShard() {
                let startTime = new Date().getTime();
                console.log('started');
                let migrationsReq = 0;
                let oldShardPositions = [];
                let newShardPositions = [];
                let keyPositions = [];
                let oldShardHoldings = [];
                let newShardHoldings = [];
                let displayShardDistributions = true;
                let migrationsBySource = [];
                initialize();

                // init shard names, shard positions, shard holdings and key positions
                for (let i = 0; i < n1 ; i++) {
                    let shardName = `shard-${i}`;
                    for (let j = 0 ; j < v ; j++) {
                        oldShardPositions.push({ name: shardName + `-${j}`, position: murmurHash(shardName + `-${j}`, p)});
                    }
                    oldShardHoldings.push([]);
                    migrationsBySource.push(0);
                }
                for (let i = 0; i < n2 ; i++) {
                    let shardName = `shard-${i}`;
                    for (let j = 0 ; j < v ; j++) {
                        newShardPositions.push({ name: shardName + `-${j}`, position: murmurHash(shardName + `-${j}`, p)});
                    }
                    newShardHoldings.push([]);
                }
                for (let i = 0 ; i < m ; i++) {
                    keyPositions.push(murmurHash(`https://${Math.random().toString(36).substring(2)}`, p));
                }

                // sort shard positions
                oldShardPositions.sort((a, b) => a.position - b.position);
                newShardPositions.sort((a, b) => a.position - b.position);

                // remove duplicate entries as they will be similar to the next element
                for (let i = 1; i < n1; i++) {
                    if (oldShardPositions[i].position === oldShardPositions[i - 1].position) {
                        oldShardPositions[i-1] = null;
                    }
                }
                oldShardPositions = oldShardPositions.filter((v => v !== null));
                let ovl = oldShardPositions.length;
                for (let i = 1; i < n2; i++) {
                    if (newShardPositions[i].position === newShardPositions[i - 1].position) {
                        newShardPositions[i-1] = null;
                    }
                }
                newShardPositions = newShardPositions.filter((v => v !== null));
                let nvl = newShardPositions.length;
                console.log('Old virtual shard count after removing collisions = ' + ovl);
                console.log('New virtual shard count after removing collisions = ' + nvl);

                // implement hash ring and see rebalancing effort
                for (let i = 0; i < m; i++) {
                    let oldShardIndex = 0;
                    let newShardIndex = 0;
                    let selectedOldShard = null;
                    let selectedNewShard = null;
                    while (oldShardIndex < ovl && keyPositions[i] > oldShardPositions[oldShardIndex].position) {
                        oldShardIndex++;
                    }
                    while (newShardIndex < nvl && keyPositions[i] > newShardPositions[newShardIndex].position) {
                        newShardIndex++;
                    }
                    oldShardIndex = oldShardIndex == ovl || oldShardIndex == 0 ? 0 : oldShardIndex - 1;
                    newShardIndex = newShardIndex == nvl || newShardIndex == 0 ? 0 : newShardIndex - 1;
                    selectedOldShard = oldShardPositions[oldShardIndex].name;
                    selectedNewShard = newShardPositions[newShardIndex].name;

                    let oldPhysicalShardIndex = selectedOldShard.substring(selectedOldShard.indexOf('-') + 1, selectedOldShard.lastIndexOf('-'));
                    let newPhysicalShardIndex = selectedNewShard.substring(selectedNewShard.indexOf('-') + 1, selectedNewShard.lastIndexOf('-'));

                    oldShardHoldings[oldPhysicalShardIndex].push(keyPositions[i]);
                    newShardHoldings[newPhysicalShardIndex].push(keyPositions[i]);
                    if (oldPhysicalShardIndex !== newPhysicalShardIndex) {
                        migrationsReq++;
                        migrationsBySource[oldPhysicalShardIndex]++;
                    }
                }

                // count empty shards
                let emptyOldShards = 0;
                for (let i = 0; i < n1; i++) {
                    if (oldShardHoldings[i].length === 0) {
                        emptyOldShards++;
                    }
                    if (displayShardDistributions && n1 <= 30) {
                        console.log(`Old Shard ${i} holds ${oldShardHoldings[i].length * 100 / m}% keys`);
                    }
                }
                let emptyNewShards = 0;
                for (let i = 0; i < n2; i++) {
                    if (newShardHoldings[i].length === 0) {
                        emptyNewShards++;
                    }
                    if (displayShardDistributions && n2 <= 30) {
                        console.log(`New Shard ${i} holds ${newShardHoldings[i].length * 100 / m}% keys`);
                    }
                }
                let endTime = new Date().getTime();

                // display data
                console.log('For ring shard:');
                console.log('number of migrations required = ' + migrationsReq);
                console.log('max migrations from one source = ' + Math.max(...migrationsBySource));
                console.log('migrations as percentage of total data = ' + (migrationsReq * 100)/m + '%');
                console.log(`Empty old shards = ${emptyOldShards}`);
                console.log(`Empty new shards = ${emptyNewShards}`);
                console.log('Rebalancing time = ' + (endTime - startTime) + ' ms');
            }
        </script>
    </head>
    <body>
        <h2>Shard Rebalancing Calculator</h2>
        <div>
            <label for="totalRecords">Total Records:</label>
            <input type="number" id="totalRecords" value="1000000" />
        </div>
        <div>
            <label for="precision">Precision:</label>
            <input type="number" id="precision" value="5" />
        </div>
        <div>
            <label for="oldShards">Number of Old Shards:</label>
            <input type="number" id="oldShards" value="500" />
        </div>
        <div>
            <label for="newShards">Number of New Shards:</label>
            <input type="number" id="newShards" value="400" />
        </div>
        <div>
            <label for="virtualShards">Virtual Shards per Physical Shard:</label>
            <input type="number" id="virtualShards" value="10" />
        </div>
        <button onclick="rebalanceModShard()">Rebalance Modulo Shard</button>
        <button onclick="rebalanceRingShard()">Rebalance Ring Shard</button>
    </body>
</html>

## RESULTS

    - so no wasted shards in new state
    - but non-zero chance for some physical shards to get completely removed due to collisions or uneven distribution
- Number of key migrations required between physical shards = 20.8%
    - key migrations in the basic module setup = 80% so we are nearly four times better
