<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Shard Rebalancing Calculator</title>
        <script>
            var m = 0;
            var p = 0;
            var n1 = 0;
            var n2 = 0;
            var v = 0;
            var r1 = 0;
            var r2 = 0;   
            var s = 0;      
            var keyPositions = [];   

            function initialize(initializeKeys = false) {
                m = parseInt(document.getElementById('totalRecords').value);
                p = parseInt(document.getElementById('precision').value);
                n1 = parseInt(document.getElementById('oldShards').value);
                n2 = parseInt(document.getElementById('newShards').value);
                v = parseInt(document.getElementById('virtualShards').value);
                r1 = parseInt(document.getElementById('rangeMin').value);
                r2 = parseInt(document.getElementById('rangeMax').value);
                s = parseInt(document.getElementById('rangeStep').value);

                if (initializeKeys) {
                    keyPositions = [];
                    for (let i = 0 ; i < m ; i++) {
                        keyPositions.push(murmurHash(`https://${Math.random().toString(36).substring(2)}`, p));
                    }
                }
            }

            function rebalanceModShard() {
                let migrationsReq = 0;
                var oldShardsList = [];
                var newShardsList = [];
                initialize(false);
                
                // initialize shard lists
                for (var i = 0 ; i < n1 ; i++) {
                    oldShardsList.push([]);
                }
                for (var i = 0 ; i < n2 ; i++) {
                    newShardsList.push([]);
                }

                // set data within shards as per modulo
                for (var i = 0 ; i < m ; i++) {
                    oldShardsList[i%n1].push(i);
                    newShardsList[i%n2].push(i);
                    if (i%n1 != i%n2) {
                        migrationsReq++;
                    }
                }

                // display data
                console.log('For modulo shard:');
                console.log('number of migrations required = ' + migrationsReq);
                console.log('migrations as percentage of total data = ' + (migrationsReq * 100)/m + '%');
            }

            /**
             * 32-bit murmur hash gives the position on a hash ring of 2^32 items (0 to 4,294,967,295)
             * reduces hash by "precision" digits
             */
            function murmurHash(key, precision) {
                // specifically chosen prime numbers
                let c1 = 0xcc9e2d51;
                let c2 = 0x1b873593;

                // other random constants
                let d1 = 0x85ebca6b;
                let d2 = 0xc2b2ae35;

                // rotation constants
                let r1 = 15;
                let r2 = 13;
                let r3 = 16;
                
                // multiplier constant
                let m = 5;
                let n = 0xe6546b64;

                // initial seed value in hash
                let hash = 0x00000001;

                // use encoder to get bytes of string and process them in chunks of 4 bytes
                let encoder = new TextEncoder();
                const bytes = encoder.encode(key);
                const view = new DataView(bytes.buffer);
                let offset = 0;
                while (bytes.length - offset >= 4) {
                    let k = view.getUint32(offset, true);
                    offset += 4;
                    k = Math.imul(k,c1);
                    k = (k << r1) | (k >>> (32 - r1));
                    k = Math.imul(k,c2);
                    hash ^= k;
                    hash = (hash << r2) | (hash >>> (32 - r2));
                    hash = (hash*m) + n;
                }

                // take remaining bytes and safely construct u32 int because getUint32 will fail if less than 4 bytes
                let k1 = 0;
                switch (bytes.length - offset) {
                    case 3: k1 ^= bytes[offset + 2] << 16;
                    case 2: k1 ^= bytes[offset + 1] << 8;
                    case 1: k1 ^= bytes[offset];
                }
                k1 = Math.imul(k1,c1);
                k1 = (k1 << r1) | (k1 >>> (32 - r1));
                k1 = Math.imul(k1,c2);
                hash ^= k1;

                // final hash updates
                hash ^= bytes.length;
                hash ^= hash >> r3;
                hash = Math.imul(hash,d1);
                hash ^= hash >> r2;
                hash = Math.imul(hash,d2);
                hash ^= hash >> r3;

                return Math.floor(hash/Math.pow(10, precision));
            }
            
            /**
             * Implement equidistant shards and see if shard utilization is better while keeping similar migration metrics
             * max virtual shards = 50K and max = 4.2B => distance between each shard is rougly 85K
             * we want virtual shards from different physical shards to be next to each other
             * we also don't want to change the virtual shard positions from old state so we always use n1 as totalShards instead of the current shardCount
             */
            function useEquiShardPositioner(totalShards, physicalShardIndex, virtualShardIndex, precision) {
                const positionIndex = ((virtualShardIndex * totalShards) + physicalShardIndex) * 85000;

                // calculate 5 digit position of the shards
                return positionIndex/(Math.pow(10, precision));
            }

            function rebalanceRingShard() {
                let startTime = new Date().getTime();
                console.log('started');
                let migrationsReq = 0;
                let oldShardPositions = [];
                let newShardPositions = [];
                let oldShardHoldings = [];
                let newShardHoldings = [];
                let migrationsBySource = [];
                const displayShardDistributions = true;
                const useEquiShardPositioning = true;
                
                initialize(true);

                // init shard names, shard positions, shard holdings and key positions
                for (let i = 0; i < n1 ; i++) {
                    let shardName = `shard-${i}`;
                    for (let j = 0 ; j < v ; j++) {
                        oldShardPositions.push({ name: shardName + `-${j}`, position: useEquiShardPositioning ? useEquiShardPositioner(n1,i,j,p) : murmurHash(shardName + `-${j}`, p)});
                    }
                    oldShardHoldings.push([]);
                    migrationsBySource.push(0);
                }
                for (let i = 0; i < n2 ; i++) {
                    let shardName = `shard-${i}`;
                    for (let j = 0 ; j < v ; j++) {
                        newShardPositions.push({ name: shardName + `-${j}`, position: useEquiShardPositioning ? useEquiShardPositioner(n1,i,j,p) : murmurHash(shardName + `-${j}`, p)});
                    }
                    newShardHoldings.push([]);
                }

                // sort shard positions
                oldShardPositions.sort((a, b) => a.position - b.position);
                newShardPositions.sort((a, b) => a.position - b.position);

                // remove duplicate entries as they will be similar to the next element
                for (let i = 1; i < n1; i++) {
                    if (oldShardPositions[i].position === oldShardPositions[i - 1].position) {
                        oldShardPositions[i-1] = null;
                    }
                }
                oldShardPositions = oldShardPositions.filter((v => v !== null));
                let ovl = oldShardPositions.length;
                for (let i = 1; i < n2; i++) {
                    if (newShardPositions[i].position === newShardPositions[i - 1].position) {
                        newShardPositions[i-1] = null;
                    }
                }
                newShardPositions = newShardPositions.filter((v => v !== null));
                let nvl = newShardPositions.length;
                console.log('Old virtual shard count after removing collisions = ' + ovl);
                console.log('New virtual shard count after removing collisions = ' + nvl);

                // implement hash ring and see rebalancing effort
                for (let i = 0; i < m; i++) {
                    let oldShardIndex = 0;
                    let newShardIndex = 0;
                    let selectedOldShard = null;
                    let selectedNewShard = null;
                    while (oldShardIndex < ovl && keyPositions[i] > oldShardPositions[oldShardIndex].position) {
                        oldShardIndex++;
                    }
                    while (newShardIndex < nvl && keyPositions[i] > newShardPositions[newShardIndex].position) {
                        newShardIndex++;
                    }
                    oldShardIndex = oldShardIndex == ovl || oldShardIndex == 0 ? 0 : oldShardIndex - 1;
                    newShardIndex = newShardIndex == nvl || newShardIndex == 0 ? 0 : newShardIndex - 1;
                    selectedOldShard = oldShardPositions[oldShardIndex].name;
                    selectedNewShard = newShardPositions[newShardIndex].name;

                    let oldPhysicalShardIndex = selectedOldShard.substring(selectedOldShard.indexOf('-') + 1, selectedOldShard.lastIndexOf('-'));
                    let newPhysicalShardIndex = selectedNewShard.substring(selectedNewShard.indexOf('-') + 1, selectedNewShard.lastIndexOf('-'));

                    oldShardHoldings[oldPhysicalShardIndex].push(keyPositions[i]);
                    newShardHoldings[newPhysicalShardIndex].push(keyPositions[i]);
                    if (oldPhysicalShardIndex !== newPhysicalShardIndex) {
                        migrationsReq++;
                        migrationsBySource[oldPhysicalShardIndex]++;
                    }
                }

                // count empty shards
                let emptyOldShards = 0;
                for (let i = 0; i < n1; i++) {
                    if (oldShardHoldings[i].length === 0) {
                        emptyOldShards++;
                    }
                    if (displayShardDistributions && n1 <= 30) {
                        console.log(`Old Shard ${i} holds ${oldShardHoldings[i].length * 100 / m}% keys`);
                    }
                }
                let emptyNewShards = 0;
                for (let i = 0; i < n2; i++) {
                    if (newShardHoldings[i].length === 0) {
                        emptyNewShards++;
                    }
                    if (displayShardDistributions && n2 <= 30) {
                        console.log(`New Shard ${i} holds ${newShardHoldings[i].length * 100 / m}% keys`);
                    }
                }
                let endTime = new Date().getTime();

                // display data
                console.log('For ring shard:');
                console.log('number of migrations required = ' + migrationsReq);
                console.log('max migrations from one source = ' + Math.max(...migrationsBySource));
                console.log('migrations as percentage of total data = ' + (migrationsReq * 100)/m + '%');
                console.log(`Empty old shards = ${emptyOldShards}`);
                console.log(`Empty new shards = ${emptyNewShards}`);
                console.log('Rebalancing time = ' + (endTime - startTime) + ' ms');
            }
        
            function findOptimalShardCounts(useEquiShardPositioning) {
                let startTime = new Date().getTime();
                console.log(`start optimizing shard counts for ${useEquiShardPositioning ? 'equi-shard' : 'murmur-hash'}`);
                initialize(true);

                let minEmptyShards = r2;
                let maxP95ShardPercent = 0;
                let optimalK = 0;
                let percentile = 95;

                for (let k = r2; k >= r1; k -= s) {
                    // init shards
                    let shardPositions = [];
                    let shardHoldings = [];

                    // init shard positions
                    for (let i = 0; i < k ; i++) {
                        let shardName = `shard-${i}`;
                        for (let j = 0 ; j < v ; j++) {
                            shardPositions.push({ name: shardName + `-${j}`, position: useEquiShardPositioning ? useEquiShardPositioner(k,i,j,p) : murmurHash(shardName + `-${j}`, p)});
                        }
                        shardHoldings.push([]);
                    }

                    // sort shard positions and remove duplicate entries
                    shardPositions.sort((a, b) => a.position - b.position);
                    for (let i = 1; i < k; i++) {
                        if (shardPositions[i].position === shardPositions[i - 1].position) {
                            shardPositions[i-1] = null;
                        }
                    }
                    shardPositions = shardPositions.filter((v => v !== null));
                    const ovl = shardPositions.length;

                    // implement hash ring and see rebalancing effort
                    for (let i = 0; i < m; i++) {
                        let shardIndex = 0;
                        let selectedShard = null;
                        while (shardIndex < ovl && keyPositions[i] > shardPositions[shardIndex].position) {
                            shardIndex++;
                        }
                        shardIndex = shardIndex == ovl || shardIndex == 0 ? 0 : shardIndex - 1;
                        selectedShard = shardPositions[shardIndex].name;
                        let physicalShardIndex = selectedShard.substring(selectedShard.indexOf('-') + 1, selectedShard.lastIndexOf('-'));
                        shardHoldings[physicalShardIndex].push(keyPositions[i]);
                    }

                    // sort the holdings by number of keys in each shard in ascending order
                    shardHoldings.sort((a, b) => a.length - b.length);

                    // count empty shards, min, mean, max and p95
                    let mean = m/k;
                    let min = shardHoldings[0].length;
                    let max = shardHoldings[k - 1].length;

                    let emptyShards = 0;
                    let meanIndex = -1;
                    let leftTotal = 0;
                    let rightTotal = 0;
                    let totalp95Shards = 0;

                    for (let i = 0; i < k; i++) {
                        if (shardHoldings[i].length === 0) {
                            emptyShards++;
                        }

                        // check for how many holdings on either side of mean
                        if (shardHoldings[i].length >= mean) {
                            meanIndex = meanIndex === -1 ? i : meanIndex;
                            rightTotal += shardHoldings[i].length;
                        } else {
                            leftTotal += shardHoldings[i].length;
                        }
                    }

                    let temmpSum = 0;
                    let p95Left = leftTotal * (percentile / 100);
                    let p95LeftDeviation = 0;
                    for (let i = meanIndex - 1; i >= 0 ; i--) {
                        temmpSum += shardHoldings[i].length;
                        totalp95Shards++;
                        if (temmpSum >= p95Left) {
                            p95LeftDeviation = mean - shardHoldings[i].length;
                            break;
                        }
                    }
                    temmpSum = 0;
                    let p95Right = rightTotal * (percentile / 100);
                    let p95RightDeviation = 0;
                    for (let i = meanIndex; i < k; i++) {
                        temmpSum += shardHoldings[i].length;
                        totalp95Shards++;
                        if (temmpSum >= p95Right) {
                            p95RightDeviation = shardHoldings[i].length - mean;
                            break;
                        }
                    }

                    // log and minimize metric
                    let p95ShardPercent = (totalp95Shards * 100) / k;
                    console.log(`Iteration ${k}: empty shards = ${emptyShards}, p95 shard % = ${p95ShardPercent}, min = ${min}, mean = ${mean.toFixed(2)}, max = ${max}, p95Left = ${p95LeftDeviation.toFixed(2)}, p95Right = ${p95RightDeviation.toFixed(2)}`);
                    if (p95ShardPercent > maxP95ShardPercent) {
                        minEmptyShards = emptyShards;
                        maxP95ShardPercent = p95ShardPercent;
                        optimalK = k;
                    }
                }

                let endTime = new Date().getTime();
                console.log(`Optimal shard count = ${optimalK} with empty shards = ${minEmptyShards} and max P95 shard % = ${maxP95ShardPercent}`);
                console.log(`Execution time = ${endTime - startTime} ms`);
            }

            function compareOptimalShardCounts() {
                findOptimalShardCounts(true);

                // add a  timeout so that we can get the logs once they end atleast
                setTimeout(() => {
                    findOptimalShardCounts(false);
                }, 100);
            }
        </script>
    </head>
    <body>
        <h2>Shard Rebalancing Calculator</h2>
        <div>
            <label for="totalRecords">Total Records:</label>
            <input type="number" id="totalRecords" value="5000000" />
        </div>
        <div>
            <label for="precision">Precision:</label>
            <input type="number" id="precision" value="5" />
        </div>
        <div>
            <label for="oldShards">Number of Old Shards:</label>
            <input type="number" id="oldShards" value="5000" />
        </div>
        <div>
            <label for="newShards">Number of New Shards:</label>
            <input type="number" id="newShards" value="4900" />
        </div>
        <div>
            <label for="virtualShards">Virtual Shards per Physical Shard:</label>
            <input type="number" id="virtualShards" value="10" />
        </div>
        <button onclick="rebalanceModShard()">Rebalance Modulo Shard</button>
        <button onclick="rebalanceRingShard()">Rebalance Ring Shard</button>
        <hr>
        <h2>Optimal Shard Count Comparison</h2>
        <div>
            <label for="rangeMin">Range min:</label>
            <input type="number" id="rangeMin" value="10" />
        </div>
        <div>
            <label for="rangeMax">Range max:</label>
            <input type="number" id="rangeMax" value="500" />
        </div>
        <div>
            <label for="rangeStep">Range step:</label>
            <input type="number" id="rangeStep" value="10" />
        </div>
        <button onclick="compareOptimalShardCounts()">Compare Optimal Shard Counts</button>
    </body>
</html>

# FINDINGS

## COMPLEXITY

### WRITE COMPLEXITY

- MurmurHash of each URL
- Then comparing the URL hash with the hashes of all virtual shards and figuring out the physical shard and put it in the corresponding queue
- Then actual complexity of batch insert

### READ COMPLEXITY

- Decode physical shard index from URL
- Then actual search complexity of the rest of the decoded URL

## SPIKE HANDLES

- 100 shards can be added/removed with roughly 5% migrations
- 100 shards handle 2K req/s per shard = 200K req/s total
- 5% of data = 275GB data
- data migration can be handled in parallel for each source which at max = 0.07% = 3.85GB
- rebalancing process would be like (total time ~3 hours)
    - spin up new shard instances if required (30 minutes)
    - spin up compute in parallel for hash ring updates and data migration (30 minutes) based on number of shards
    - send new hash ring updates to all service instances (60 minutes)
    - migrate at max 3.85GB records from each shard in separate compute cluster (60 minutes)
    - tear down compute cluster and any old shard instances if required
- So it handles spike rates of 200K RPS change in 3 hours
    - services can start writing to new shards within 2 hours and requests may end up with double latency in the final hour
